<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Vocab Quest 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one centred app column (max 680px); cards for units, one question card per step; notebook-blue ink with a sunflower highlight */
:root{color-scheme:light;
  --bg:#EEF3F5; --surface:#FFFFFF; --surface2:#F6F9FA; --ink:#14313A; --muted:#58707A; --line:#D5E0E4;
  --accent:#F3A93A; --accent-ink:#3B2500; --teal:#1E6C77; --teal-soft:#DCEDEF;
  --ok:#23845A; --ok-bg:#E1F3E9; --bad:#C24A3F; --bad-bg:#FBE5E2; --warn:#9A6A00; --warn-bg:#FFF2D6;
  --u1:#1E6C77; --u2:#C25B3A; --u3:#4E7F2E; --u4:#6A4FA3; --uv:#B07A10;
  --display:"Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1C21; --surface:#162A30; --surface2:#1B323A; --ink:#E5EEF0; --muted:#9BB1B8; --line:#2B434B;
  --accent:#F2B24E; --accent-ink:#2A1A00; --teal:#64BCC6; --teal-soft:#1D3E44;
  --ok:#5CC690; --ok-bg:#163A2A; --bad:#F08177; --bad-bg:#3E201D; --warn:#E9BC57; --warn-bg:#3A2E12;
  --u1:#5FB6C1; --u2:#E58C6C; --u3:#8CC16A; --u4:#A891DD; --uv:#E2B24F; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1C21; --surface:#162A30; --surface2:#1B323A; --ink:#E5EEF0; --muted:#9BB1B8; --line:#2B434B;
  --accent:#F2B24E; --accent-ink:#2A1A00; --teal:#64BCC6; --teal-soft:#1D3E44;
  --ok:#5CC690; --ok-bg:#163A2A; --bad:#F08177; --bad-bg:#3E201D; --warn:#E9BC57; --warn-bg:#3A2E12;
  --u1:#5FB6C1; --u2:#E58C6C; --u3:#8CC16A; --u4:#A891DD; --uv:#E2B24F; color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 40px}
#app{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:2rem} h2{font-size:1.4rem} h3{font-size:1.1rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.25rem;color:var(--teal)}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:1.05rem}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--teal);color:var(--surface);min-height:46px;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--teal);border:2px solid var(--line)}
.btn.small{min-height:38px;padding:7px 12px;font-size:.92rem}
.btn[disabled]{opacity:.45;cursor:default}
.btn.block{width:100%}
.link{background:none;border:0;color:var(--teal);text-decoration:underline;padding:4px;font-weight:700}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.9rem;font-variant-numeric:tabular-nums}
.chip b{font-family:var(--display);font-weight:600}

.hero{background:var(--teal);color:var(--surface);border:0}
.hero .muted{color:inherit;opacity:.85}
.hero .btn{background:var(--accent);color:var(--accent-ink)}

.unit{display:flex;flex-direction:column;gap:10px}
.unit-head{display:flex;gap:12px;align-items:center}
.num{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--surface);background:var(--c,var(--teal));font-size:1.05rem}
.bar{height:10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--c,var(--teal));border-radius:99px}
.unit .meta{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}

.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:6px;border-radius:10px;padding:6px 10px;font-size:.85rem;border:1px dashed var(--line);color:var(--muted)}
.badge.on{border:1px solid var(--accent);background:var(--warn-bg);color:var(--ink)}
.badge svg{flex:none}

/* game */
.gamehead{display:flex;align-items:center;gap:12px}
.progress{flex:1;height:12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;gap:16px}
.qtype{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.prompt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.word{font-family:var(--display);font-weight:600;font-size:1.9rem;line-height:1.2;overflow-wrap:anywhere}
.speak{border:1px solid var(--line);background:var(--surface2);border-radius:50%;width:40px;height:40px;display:grid;place-items:center;color:var(--teal);flex:none}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px 14px;min-height:52px;font-size:1.02rem}
.opt:hover:not([disabled]){border-color:var(--teal)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.field{width:100%;border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:1.1rem;min-height:52px}
.field:focus{border-color:var(--teal);outline:none}
.field.ok{border-color:var(--ok);background:var(--ok-bg)}
.field.bad{border-color:var(--bad);background:var(--bad-bg)}
.hint{font-family:var(--mono);letter-spacing:.18em;color:var(--muted);font-size:1rem}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:var(--ok-bg);color:var(--ink)}
.fb.bad{background:var(--bad-bg);color:var(--ink)}
.fb.warn{background:var(--warn-bg)}
.fb strong{font-family:var(--display);font-weight:600;font-size:1.1rem}
.fb.ok strong{color:var(--ok)} .fb.bad strong{color:var(--bad)} .fb.warn strong{color:var(--warn)}
.ex{font-style:italic}
.ex b{font-style:normal;background:var(--warn-bg);padding:0 4px;border-radius:4px}
.gapline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;line-height:2.1;padding:8px 0;border-bottom:1px solid var(--line)}
.gapline:last-child{border-bottom:0}
.gapline select{border:2px solid var(--line);background:var(--surface2);border-radius:10px;padding:4px 8px;min-height:40px;max-width:100%}
.gapline select.ok{border-color:var(--ok);background:var(--ok-bg)}
.gapline select.bad{border-color:var(--bad);background:var(--bad-bg)}
.gapline .fix{color:var(--ok);font-weight:700}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mbtn{border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px;min-height:52px;text-align:center;overflow-wrap:anywhere}
.mbtn.sel{border-color:var(--teal);background:var(--teal-soft)}
.mbtn.done{border-color:var(--ok);background:var(--ok-bg);color:var(--muted)}
.mbtn.shake{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.three label{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:4px;min-width:0}
.three .field{font-size:1rem;padding:10px}
@media (max-width:440px){.three{grid-template-columns:1fr}}

.result-score{font-family:var(--display);font-size:3rem;font-weight:700;color:var(--teal);line-height:1;font-variant-numeric:tabular-nums}
.misslist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.misslist li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:6px 0}
.misslist li span:last-child{color:var(--muted);text-align:right}

textarea.code{width:100%;min-height:120px;border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px;font-family:var(--mono);font-size:.82rem;word-break:break-all;resize:vertical}
.notice{background:var(--warn-bg);border-radius:12px;padding:10px 14px;font-size:.92rem}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums;background:var(--surface)}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--display);font-weight:600;background:var(--surface2)}
td .mini{display:inline-block;width:42px;height:7px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);vertical-align:middle;margin-left:6px;overflow:hidden}
td .mini i{display:block;height:100%;background:var(--teal)}
.profilelist{display:grid;gap:8px}
.pbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px 14px;text-align:left}
.pbtn:hover{border-color:var(--teal)}
footer{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;padding-top:8px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function unlockedItems(){
  const p = P(); const out = [];
  UNITS.forEach(u => u.secs.forEach(s => { if (s.items.some(it => p.box[it.id] !== undefined)) out.push(...s.items); }));
  return out.length >= 8 ? out : BYUNIT[UNITS[0].id];
}
let round = null;
function buildRound(mode){
  const used = new Set(); const mix = mode.kind === "mix";
  let pool = [], dpool = [];
  if (mix) { pool = unlockedItems(); dpool = pool.length >= 12 ? pool : ITEMS; }
  else if (mode.kind === "unit") {
    const u = UNITS.find(x => x.id === mode.unit); dpool = BYUNIT[u.id];
    if (mode.sec === undefined) pool = BYUNIT[u.id];
    else {
      pool = u.secs[mode.sec].items.slice();
      for (let k = mode.sec - 1; k >= 0 && pool.length < 8; k--) pool = pool.concat(u.secs[k].items);
      for (let k = mode.sec + 1; k < u.secs.length && pool.length < 8; k++) pool = pool.concat(u.secs[k].items);
    }
  }
  const steps = [];
  if (mode.kind === "verbs"){
    const plan = shuffle(["vform","vform","vform","vmc","vmc","vmc","vthree","vthree"]).concat(["vmatch"]);
    plan.forEach(t => {
      if (t === "vmatch") { const vs = pickWeighted(VERBS, 5, new Set(), false); steps.push({t, items:vs}); return; }
      const [v] = pickWeighted(VERBS, 1, used, false); if (!v) return;
      const form = Math.random() < .5 ? "past" : "pp";
      steps.push(t === "vmc" ? {t, item:v, form, options:verbOptions(v, form)} : {t, item:v, form});
    });
  } else {
    const plan = shuffle(["mcEnDe","mcDeEn","type","vform","mcEnDe","type","vmc","mcDeEn","vthree"]);
    plan.splice(4, 0, "match"); plan.push("gap");
    plan.forEach(t => {
      if (t === "match") { const its = pickWeighted(pool, 5, used, mix); steps.push({t, items:its}); return; }
      if (t === "gap") {
        const taken = new Set(); const its = pickWeighted(pool, 4, used, mix, x => { const k = norm(x.a); if (taken.has(k)) return false; return true; });
        const uniq = []; its.forEach(x => { const k = norm(x.a); if (!taken.has(k)) { taken.add(k); uniq.push(x); } });
        steps.push({t, items:uniq, bank:shuffle(uniq.map(x => x.a))}); return;
      }
      if (t[0] === "v") {
        const [v] = pickWeighted(VERBS, 1, used, false); const form = Math.random() < .5 ? "past" : "pp";
        steps.push(t === "vmc" ? {t, item:v, form, options:verbOptions(v, form)} : {t, item:v, form}); return;
      }
      const [it] = pickWeighted(pool, 1, used, mix); if (!it) return;
      if (t === "mcEnDe") steps.push({t, item:it, options:shuffle([it, ...distractors(it, dpool, "de", 3)])});
      else if (t === "mcDeEn") steps.push({t, item:it, options:shuffle([it, ...distractors(it, dpool, "en", 3)])});
      else steps.push({t, item:it});
    });
  }
  round = {mode, steps, i:0, points:0, max:0, misses:new Map(), answered:false, xp0:P().xp, newBadges:[]};
}
function record(it, ok){
  const p = P(); const b = p.box[it.id];
  p.box[it.id] = ok ? Math.min(5, (b === undefined ? 0 : b) + 1) : 0;
  p.ans++; round.max++;
  if (ok) { p.cor++; p.xp += 10; round.points++; } else round.misses.set(it.id, it);
}

const verbLine = v => `<b>${esc(v.inf)} – ${esc(v.past.replace("/", " / "))} – ${esc(v.pp)}</b> <span class="muted">(${esc(v.de)})</span>`;
function feedback(kind, title, extra){

  $("#fb").innerHTML = `<div class="fb ${kind}"><strong>${title}</strong>${extra || ""}</div><div class="row" style="margin-top:12px"><button class="btn accent block" data-act="next" id="nextbtn">${round.i + 1 < round.steps.length ? "Weiter" : "Ergebnis ansehen"}</button></div>`;

const PRAISE = ["Richtig!", "Super!", "Genau!", "Stark!", "Klasse!"];
const praise = () => PRAISE[Math.floor(Math.random() * PRAISE.length)];

function answerMC(k){
  const st = round.steps[round.i]; if (round.answered) return;
  const it = st.item, chosen = st.options[k];
  const ok = st.t === "mcEnDe" ? norm(chosen.de) === norm(it.de) : norm(chosen.en) === norm(it.en);
  const btns = [...document.querySelectorAll(".opt")];
  st.options.forEach((o, j) => { const right = st.t === "mcEnDe" ? norm(o.de) === norm(it.de) : norm(o.en) === norm(it.en); if (right) btns[j].classList.add("ok"); });
  if (!ok) btns[k].classList.add("bad");
  record(it, ok);
  feedback(ok ? "ok" : "bad", ok ? praise() : "Leider falsch", `<span><b>${esc(it.en)}</b> = ${esc(it.de)}</span><span class="ex">${filled(it)}</span>`);
  if (ok && st.t === "mcDeEn") say(cleanEn(it.en));
}
function answerType(){
  const st = round.steps[round.i]; if (round.answered) return;
  const inp = $("#ans"); if (!inp.value.trim()) { inp.focus(); return; }
  const res = checkTyped(inp.value, wordVariants(st.item));
  inp.classList.add(res === "bad" ? "bad" : "ok");
  record(st.item, res !== "bad");
  const it = st.item;
  if (res === "ok") feedback("ok", praise(), `<span class="ex">${filled(it)}</span>`);
  else if (res === "close") feedback("warn", "Fast richtig! Achte auf die Schreibweise.", `<span>Richtig geschrieben: <b>${esc(cleanEn(it.en))}</b></span><span class="ex">${filled(it)}</span>`);
  else feedback("bad", "Leider falsch", `<span>Richtig ist: <b>${esc(cleanEn(it.en))}</b></span><span class="ex">${filled(it)}</span>`);
  say(cleanEn(it.en));
}
function answerVForm(){
  const st = round.steps[round.i]; if (round.answered) return;
  const inp = $("#ans"); if (!inp.value.trim()) { inp.focus(); return; }
  const v = st.item; const res = checkTyped(inp.value, formVariants(v[st.form]));
  const ok = res === "ok";
  inp.classList.add(ok ? "ok" : "bad"); record(v, ok);
  feedback(ok ? "ok" : "bad", ok ? praise() : (res === "close" ? "Knapp daneben, achte auf die Schreibweise." : "Leider falsch"), `<span>${verbLine(v)}</span>`);
}
function answerVMC(k){
  const st = round.steps[round.i]; if (round.answered) return;
  const v = st.item; const ok = st.options[k] === v[st.form];
  const btns = [...document.querySelectorAll(".opt")];
  st.options.forEach((o, j) => { if (o === v[st.form]) btns[j].classList.add("ok"); });
  if (!ok) btns[k].classList.add("bad");
  record(v, ok);
  feedback(ok ? "ok" : "bad", ok ? praise() : "Leider falsch", `<span>${verbLine(v)}</span>`);
}
function answerVThree(){
  const st = round.steps[round.i]; if (round.answered) return;
  const v = st.item; const forms = [v.inf, v.past, v.pp];
  const ins = [0,1,2].map(k => $("#f"+k));
  const empty = ins.find(i => !i.value.trim()); if (empty) { empty.focus(); return; }
  let all = true;
  ins.forEach((inp, k) => { const ok = formVariants(forms[k]).includes(norm(inp.value)); inp.classList.add(ok ? "ok" : "bad"); if (!ok) all = false; });
  record(v, all);
  feedback(all ? "ok" : "bad", all ? praise() : "Nicht ganz", `<span>${verbLine(v)}</span>`);
}
function gapChange(){ const st = round.steps[round.i]; const b = $("#gapbtn"); if (b) b.disabled = st.items.some((_,k) => !$("#g"+k).value); }
function answerGap(){
  const st = round.steps[round.i]; if (round.answered) return;
  let right = 0;
  st.items.forEach((x, k) => {
    const sel = $("#g"+k); const ok = norm(sel.value) === norm(x.a);
    sel.classList.add(ok ? "ok" : "bad"); record(x, ok); if (ok) right++;
    else sel.insertAdjacentHTML("afterend", `<span class="fix">→ ${esc(x.a)}</span>`);
  });
  const all = right === st.items.length;
  feedback(all ? "ok" : (right ? "warn" : "bad"), all ? "Alle Lücken richtig!" : `${right} von ${st.items.length} Lücken richtig`, all ? "" : `<span>Die richtigen Wörter stehen jetzt grün neben den Lücken.</span>`);
}
// Paare finden
let matchSel = null;
function matchLeft(btn){
  if (round.answered || btn.classList.contains("done")) return;
  document.querySelectorAll('.mbtn[data-act="ml"]').forEach(b => b.classList.remove("sel"));
  btn.classList.add("sel"); matchSel = btn.dataset.id;
}
function matchRight(btn){
  const st = round.steps[round.i];
  if (round.answered || btn.classList.contains("done") || !matchSel) return;
  st._wrong = st._wrong || new Set(); st._done = st._done || new Set();
  const lb = document.querySelector(`.mbtn[data-act="ml"][data-id="${matchSel}"]`);
  const a = BYID[matchSel], b = BYID[btn.dataset.id];
  const same = st.t === "match" ? norm(a.de) === norm(b.de) : norm(a.past) === norm(b.past);
  if (same) {
    lb.classList.remove("sel"); lb.classList.add("done"); btn.classList.add("done"); lb.disabled = btn.disabled = true;
    st._done.add(matchSel); record(a, !st._wrong.has(matchSel)); matchSel = null;
    if (st._done.size === st.items.length) {
      const errs = st._wrong.size;
      feedback(errs ? "warn" : "ok", errs ? `Geschafft, mit ${errs} ${errs === 1 ? "Fehler" : "Fehlern"}` : "Alle Paare beim ersten Versuch!", st.t === "match" ? "" : `<span>Die Wörter mit Fehlern kommen bald wieder dran.</span>`);
    }
  } else {
    st._wrong.add(matchSel);
    btn.classList.add("shake"); setTimeout(() => btn.classList.remove("shake"), 450);
  }
}
function nextStep(){
  round.answered = false; matchSel = null; round.i++;
  if (round.i >= round.steps.length) return finishRound();
  save(); render();
}
function finishRound(){
  const p = P(); p.rounds++; const d = today(); if (!p.days.includes(d)) p.days.push(d); if (p.days.length > 120) p.days = p.days.slice(-120);
  const perfect = round.points === round.max && round.max > 0;
  if (perfect) p.xp += 20;
  BADGES.forEach(b => { if (!p.badges.includes(b.id) && b.test(p, {perfect})) { p.badges.push(b.id); round.newBadges.push(b); } });
  round.perfect = perfect; save(); screen = "result"; render();
}
function resultView(){
  const p = P(); const gained = p.xp - round.xp0; const misses = [...round.misses.values()];
  const msg = round.perfect ? "Perfekte Runde! Du bekommst 20 Bonus-XP." : round.points / Math.max(1, round.max) >= .7 ? "Gut gemacht! Die Fehler kommen in den nächsten Runden wieder dran." : "Dranbleiben! Übe gleich noch eine Runde, dann sitzen die Wörter besser.";
  return `${header()}
  <div class="card stack" style="text-align:center;align-items:center">
    <p class="qtype">Runde geschafft</p>
    <div class="result-score">${round.points} / ${round.max}</div>
    <p>richtige Antworten · <b>+${gained} XP</b></p>
    <p class="muted">${msg}</p>
  </div>
  ${round.newBadges.length ? `<div class="card stack"><h3>Neues Abzeichen!</h3><div class="badges">${round.newBadges.map(b => `<span class="badge on">${medal(true)}${esc(b.name)}</span>`).join("")}</div></div>` : ""}
  ${misses.length ? `<div class="card stack"><h3>Diese Wörter üben wir noch</h3><ul class="misslist">${misses.map(m => m.kind === "v" ? `<li><span><b>${esc(m.inf)} – ${esc(m.past.replace("/"," / "))} – ${esc(m.pp)}</b></span><span>${esc(m.de)}</span></li>` : `<li><span><b>${esc(m.en)}</b></span><span>${esc(m.de)}</span></li>`).join("")}</ul></div>` : ""}
  <div class="row"><button class="btn accent" data-act="again" style="flex:1">Noch eine Runde</button><button class="btn ghost" data-act="leave" style="flex:1">Zur Übersicht</button></div>`;
}
function codeView(){
  const code = encodeProfile(P());
  return `${header(`<button class="btn ghost small" data-act="home">Zurück</button>`)}
  <div class="card stack"><h2>Dein Fortschrittscode</h2>
  <p>Kopiere den Code und gib ihn deiner Lehrkraft, zum Beispiel über die Lernplattform oder per Mail. Der Code zeigt deinen Stand von heute.</p>
  <textarea class="code" id="codebox" readonly>${esc(code)}</textarea>
  <div class="row"><button class="btn accent" data-act="copy">Code kopieren</button><span id="copymsg" class="muted small"></span></div>
  <p class="muted small">Auf einem anderen Gerät kannst du mit diesem Code an derselben Stelle weiterüben. Wähle dort „Ich habe schon einen Fortschrittscode“.</p></div>`;
}
function restoreView(){
  return `${header(`<button class="btn ghost small" data-act="back-start">Zurück</button>`)}
  <form class="card stack" data-form="restore"><h2>Mit Code weiterüben</h2>
  <p>Füge hier deinen Fortschrittscode ein.</p>
  <textarea class="code" id="restorebox" placeholder="VQ1. …" autofocus></textarea>
  <div id="restoremsg"></div>
  <button class="btn accent" type="submit">Fortschritt laden</button></form>`;
}

// ---------- Lehrer-Ansicht ----------
let teacherRows = null, teacherInput = "";
function teacherView(){
  return `${header(`<button class="btn ghost small" data-act="teacher-back">Zurück</button>`)}
  <div class="card stack"><h2>Klassenübersicht</h2>
    <p>Füge die Fortschrittscodes deiner Schülerinnen und Schüler ein, gern alle auf einmal. Die Auswertung passiert nur hier im Browser.</p>
    <textarea class="code" id="tcodes" placeholder="VQ1. …">${esc(teacherInput)}</textarea>
    <div class="row"><button class="btn" data-act="tread">Auswerten</button><span id="tmsg" class="muted small"></span></div>
  </div>
  ${teacherRows ? teacherTable() : ""}`;
}
function teacherTable(){
  const rows = teacherRows;
  if (!rows.length) return `<div class="notice">Es wurde kein gültiger Code gefunden.</div>`;
  const pctCell = (s) => { const pc = Math.round(s.safe / s.total * 100); return `<td>${pc} %<span class="mini"><i style="width:${pc}%"></i></span></td>`; };
  const trouble = new Map();
  rows.forEach(r => { r.prof && Object.entries(r.prof.box).forEach(([id, b]) => { if (b === 0) trouble.set(id, (trouble.get(id) || 0) + 1); }); });
  const top = [...trouble.entries()].sort((a,b) => b[1] - a[1]).slice(0, 12);
  return `<div class="card stack"><h3>${rows.length} ${rows.length === 1 ? "Schüler/in" : "Schülerinnen und Schüler"}</h3>
  <div class="tablewrap"><table><thead><tr><th>Name</th><th>Stand vom</th><th>Runden</th><th>XP</th><th>Richtig</th>${UNITS.map(u => `<th>${u.name}</th>`).join("")}<th>Verben</th><th>Zuletzt geübt</th></tr></thead>
  <tbody>${rows.map(r => `<tr><td><b>${esc(r.prof.name)}</b></td><td>${fmtDate(r.date)}</td><td>${r.prof.rounds}</td><td>${r.prof.xp}</td><td>${r.prof.ans ? Math.round(r.prof.cor / r.prof.ans * 100) : 0} %</td>${UNITS.map(u => pctCell(unitStats(r.prof, BYUNIT[u.id]))).join("")}${pctCell(unitStats(r.prof, VERBS))}<td>${fmtDate(r.prof.days.slice().sort().pop())}</td></tr>`).join("")}</tbody></table></div>
  <p class="muted small">Prozentwerte = Anteil der Wörter, die sicher sitzen (dreimal hintereinander richtig).</p></div>
  ${top.length ? `<div class="card stack"><h3>Diese Wörter machen gerade Probleme</h3><p class="muted small">Anzahl der Schüler/innen, bei denen das Wort zuletzt falsch war.</p><ul class="misslist">${top.map(([id,n]) => { const x = BYID[id]; if (!x) return ""; return `<li><span><b>${esc(x.kind === "v" ? x.inf + " – " + x.past + " – " + x.pp : x.en)}</b> <span class="muted small">${x.kind === "v" ? "Verb" : "Unit " + x.unit}</span></span><span>${n}</span></li>`; }).join("")}</ul></div>` : ""}`;
}
function teacherRead(){
  teacherInput = $("#tcodes").value;
  const found = teacherInput.match(/VQ1\.[A-Za-z0-9+/=]+\.[a-z0-9]{4}/g) || [];
  const byName = new Map(); let bad = 0;
  found.forEach(c => { const o = decodeCode(c); if (!o) { bad++; return; } const prof = profileFromCode(o); const key = prof.name.toLowerCase(); const prev = byName.get(key); if (!prev || (o.d || "") >= prev.date) byName.set(key, {prof, date:o.d}); });
  teacherRows = [...byName.values()].sort((a,b) => a.prof.name.localeCompare(b.prof.name, "de"));
  render();
  if (bad) $("#tmsg").textContent = bad + (bad === 1 ? " Code war" : " Codes waren") + " beschädigt und wurde übersprungen.";
}

// ---------- Ereignisse ----------
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-say]"); if (!t) return;
  if (t.dataset.say !== undefined && !t.dataset.act) { say(t.dataset.say); return; }
  const a = t.dataset.act;
  if (a === "pick") { store.current = t.dataset.name; save(); screen = "home"; render(); }
  else if (a === "switch") { screen = "start"; render(); }
  else if (a === "openunit") { curUnit = +t.dataset.unit; screen = "unit"; render(); window.scrollTo(0,0); }
  else if (a === "play") { const mode = t.dataset.mode === "unit" ? {kind:"unit", unit:+t.dataset.unit} : {kind:t.dataset.mode}; if (t.dataset.sec !== undefined) mode.sec = +t.dataset.sec; buildRound(mode); screen = "game"; render(); window.scrollTo(0,0); }
  else if (a === "again") { buildRound(round.mode); screen = "game"; render(); window.scrollTo(0,0); }
  else if (a === "home") { save(); screen = "home"; render(); window.scrollTo(0,0); }
  else if (a === "leave") { save(); if (round && round.mode.kind === "unit") { curUnit = round.mode.unit; screen = "unit"; } else screen = "home"; render(); window.scrollTo(0,0); }
  else if (a === "mc") answerMC(+t.dataset.k);
  else if (a === "vmc") answerVMC(+t.dataset.k);
  else if (a === "gapcheck") answerGap();
  else if (a === "ml") matchLeft(t);
  else if (a === "mr") matchRight(t);
  else if (a === "next") { nextStep(); window.scrollTo(0,0); }
  else if (a === "code") { screen = "code"; render(); }
  else if (a === "copy") { const box = $("#codebox"); const done = m => $("#copymsg").textContent = m;
    try { navigator.clipboard.writeText(box.value).then(() => done("Kopiert."), () => { box.select(); done("Markiert. Jetzt mit Strg+C oder „Kopieren“ übernehmen."); }); }
    catch(err) { box.select(); done("Markiert. Jetzt mit Strg+C oder „Kopieren“ übernehmen."); } }
  else if (a === "restore") { screen = "code-restore"; render(); }
  else if (a === "back-start") { screen = "start"; render(); }
  else if (a === "teacher") { screen = "teacher"; render(); window.scrollTo(0,0); }
  else if (a === "teacher-back") { screen = P() ? "home" : "start"; render(); }
  else if (a === "tread") teacherRead();
  if (t.dataset.say && t.dataset.act) say(t.dataset.say);
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "newform") {
    const name = $("#newname").value.trim().replace(/\s+/g, " ").slice(0, 24); if (!name) { $("#newname").focus(); return; }
    if (!store.profiles[name]) store.profiles[name] = newProfile(name);
    store.current = name; save(); screen = "home"; render(); return;
  }
  const k = f.dataset.form;
  if (k === "type") answerType(); else if (k === "vform") answerVForm(); else if (k === "vthree") answerVThree();
  else if (k === "restore") {
    const o = decodeCode($("#restorebox").value);
    if (!o) { $("#restoremsg").innerHTML = `<div class="fb bad"><strong>Der Code passt nicht.</strong><span>Kopiere ihn bitte noch einmal vollständig. Er beginnt mit „VQ1.“.</span></div>`; return; }
    const p = profileFromCode(o); store.profiles[p.name] = p; store.current = p.name; save(); screen = "home"; render();
  }
});
document.addEventListener("change", e => { if (e.target.matches("[data-gap]")) gapChange(); });
document.addEventListener("keydown", e => {
  if (screen !== "game" || !round) return;
  if (e.key === "Enter" && round.answered && !e.target.closest("form")) { e.preventDefault(); nextStep(); window.scrollTo(0,0); }
  const st = round.steps[round.i];
  if (!round.answered && st && ["mcEnDe","mcDeEn","vmc"].includes(st.t) && /^[1-4]$/.test(e.key) && e.target.tagName !== "INPUT") {
    st.t === "vmc" ? answerVMC(+e.key - 1) : answerMC(+e.key - 1);
  }
});

load();
if (store.current && store.profiles[store.current]) screen = "home";
render();
</script>

</body>
</html>
